name: Publish Wiki Documentation

on:
  gollum:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs-material==9.6.15"

      - name: Prepare documentation source
        run: |
          # Attempt to clone the GitHub Wiki (may not exist yet).
          # If the wiki exists, use it as the documentation source.
          # Otherwise, fall back to developer_docs from the repository.
          if git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki-source 2>/dev/null; then
            echo "Wiki cloned successfully - converting to MkDocs"
            python tools/convert-wiki-for-mkdocs.py wiki-source docs
          else
            echo "Wiki repository not found - using developer_docs as documentation source"
            rm -rf docs
            cp -r developer_docs docs
            if [ ! -f docs/index.md ] && [ ! -f docs/Home.md ] && [ ! -f docs/README.md ]; then
              echo "# HMIS Documentation" > docs/index.md
              echo "" >> docs/index.md
              echo "Welcome to the HMIS documentation." >> docs/index.md
            fi
          fi

      - name: Copy extra site files
        run: |
          cp -r mkdocs-extra/. docs/

      - name: Build MkDocs site
        run: |
          mkdocs build --site-dir site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
